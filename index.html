<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MC Parrot 🦜</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #0E0E12; color: #fff; -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 30px; text-align: center; margin: 8px 0 2px; }
    .sub { text-align: center; color: #9A9AA8; font-size: 13px; margin-bottom: 18px; }
    .card { background: #17171E; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .label { color: #C9C9D4; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 20px; background: #23232D; color: #C9C9D4; border: 1px solid transparent; font-size: 13px; cursor: pointer; user-select: none; }
    .chip.on { background: #F5A524; color: #0E0E12; font-weight: 700; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    button.big { width: 100%; padding: 16px; border: none; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .rec { background: #E5484D; color: #fff; }
    .rec.on { background: #7a2224; }
    .gen { background: #6E56CF; color: #fff; }
    .exp { background: #F5A524; color: #0E0E12; }
    button:disabled { opacity: .45; cursor: default; }
    input[type=range] { flex: 1; accent-color: #F5A524; }
    .status { text-align: center; color: #9A9AA8; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .note { color: #7a7a88; font-size: 11px; text-align: center; margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MC Parrot 🦜</h1>
    <div class="sub">the sounds you record → a song</div>

    <div class="card">
      <button id="recBtn" class="big rec">● Record</button>
      <div class="row"><span id="recTime" style="color:#9A9AA8;font-size:13px;">Record some ambient sounds (and a bit of voice)</span></div>
    </div>

    <div class="card">
      <div class="label">Genre</div>
      <div id="genres" class="chips"></div>
      <div class="label">Scale</div>
      <div id="scales" class="chips"></div>
      <div class="label">Tempo (BPM): <span id="bpmVal">116</span></div>
      <div class="row"><input id="bpm" type="range" min="50" max="180" value="116" /></div>
    </div>

    <button id="genBtn" class="big gen" disabled>♪ Generate music</button>
    <button id="playBtn" class="big gen" disabled style="background:#3A3A46">▶ Play again</button>
    <button id="expBtn" class="big exp" disabled>⤓ Export / Download (WAV)</button>

    <div id="status" class="status"></div>
    <div class="note">Everything happens in your browser: your audio is never uploaded anywhere. Microphone only.</div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
